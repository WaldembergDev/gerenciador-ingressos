<!-- mensagens de alerta -->
{% if messages %}
    <!-- Adicionado 'top-0' para fixar no topo e movido o 'z-index' para cá -->
    <div class="position-fixed top-0 end-0 p-3 mt-5" style="z-index: 1000;">
    {% for message in messages %}
        <div class="alert alert-important alert-{{ message.tags }} alert-dismissible" role="alert">
            <div>
                <div class="alert-description">{{ message }}</div>
            </div>
            <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
        </div>
    {% endfor %}
    </div>
{% endif %}
