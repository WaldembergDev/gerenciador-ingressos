name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do respositório
        uses: actions/checkout@v4
        
      - name: 
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-django
      
      - name: Executar os Testes com Pytest
        env:
            SECRET_KEY: "ci-secret-key-temporary"
            PATH_SETTINGS: 'maraca_ingresso.settings.test'
            DJANGO_SETTINGS_MODULE: "maraca_ingresso.settings.test"
        run: |
          pytest