<div class="modal-header">
    <h5 class="modal-title">Edição de Time</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div id="modal-body-editar" class="modal-body">
    <form method="POST" action="{% url 'time_edit' form.instance.id %}" id="formEditar" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.escudo.id_for_label }}" class="form-label fw-bold">Escudo</label>
            {{ form.escudo }}
            {{ form.escudo.errors }}
        </div>
        <div class="mb-3">
            <label for="{{ form.nome.id_for_label }}" class="form-label fw-bold">Nome</label>
            {{ form.nome }}
            {{ form.nome.errors }}
        </div>
    </form>    
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary me-auto" data-bs-dismiss="modal">Cancelar</button>
    <button type="submit" form="formEditar" class="btn btn-primary" data-bs-dismiss="modal">Confirmar Alterações</button>
</div>
